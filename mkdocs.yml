site_name: Pulumi for Mere Mortals
site_description: Infrastructure described in a real programming language. Writing a small Python program that declares resources, previewing what it will do before it does it, keeping its state and secrets in order across several stacks, and destroying it all cleanly, with the limits stated plainly.
